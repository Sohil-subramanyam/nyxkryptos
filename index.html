<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyx - Decentralized Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --cursor-size: 12px;
      }
      
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #fcfcfc; /* Off-white premium feel */
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        cursor: none; /* Hide default cursor */
      }
      
      h1, h2, h3, h4, .font-display {
        font-family: 'Space Grotesk', sans-serif;
      }

      .font-serif {
        font-family: 'Playfair Display', serif;
      }

      /* Snap Scrolling for Landing */
      .snap-container {
        scroll-snap-type: y mandatory;
        overflow-y: scroll;
        height: 100vh;
        scroll-behavior: smooth;
      }
      
      .snap-section {
        scroll-snap-align: start;
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      
      /* Glass & Premium Cards */
      .premium-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(0, 0, 0, 0.04);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.08);
      }
      
      .premium-input {
        background: transparent;
        border-bottom: 1px solid #e5e5e5;
        transition: border-color 0.3s ease;
      }
      .premium-input:focus {
        border-color: #000;
        outline: none;
      }

      /* Cursor Styles */
      .custom-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--cursor-size);
        height: var(--cursor-size);
        border-radius: 50%;
        background-color: #000;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: width 0.3s cubic-bezier(0.19, 1, 0.22, 1), height 0.3s cubic-bezier(0.19, 1, 0.22, 1);
      }
      
      .cursor-trail {
        position: fixed;
        top: 0;
        left: 0;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition: opacity 0.5s ease;
      }

      /* Interactive Hover States */
      button:hover ~ .custom-cursor, a:hover ~ .custom-cursor {
        width: 40px;
        height: 40px;
        background-color: transparent;
        border: 1px solid #000;
      }

      /* Hide Scrollbar */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      
      .animate-float {
        animation: float 10s ease-in-out infinite;
      }
      
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "crypto-js": "https://esm.sh/crypto-js@^4.2.0"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
